<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平面镜成像规律</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
    :root {
      --panel-bg: rgba(28, 32, 42, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #3b82f6;
      --danger: #ef4444;
      --track: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: #1a1d28; color: var(--text); user-select: none;
    }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: absolute; top: 16px; left: 16px; width: 320px;
      max-height: calc(100% - 32px); overflow-y: auto;
      background: var(--panel-bg); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 16px;
      padding: 16px 14px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); z-index: 10;
    }
    #panel::-webkit-scrollbar { width: 4px; }
    #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }
    .section { margin-bottom: 18px; }
    .section-title { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .label { font-size: 15px; color: var(--muted); white-space: nowrap; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .btn {
      flex: 1; min-width: 0; border: none; border-radius: 8px; padding: 8px 6px;
      font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
      background: rgba(255,255,255,.08); color: var(--text); transition: background .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: rgba(255,255,255,.14); }
    .btn.active { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn.full { flex: 1 1 100%; }
    .btn.ghost-danger { background: transparent; color: var(--danger); margin-top: 4px; }
    .btn.ghost-danger:hover:not(:disabled) { background: rgba(239,68,68,.12); }
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0; background: var(--track); border-radius: 24px; cursor: pointer; transition: .2s;
    }
    .switch .slider::before {
      content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .slider-block { margin-bottom: 12px; }
    .slider-block .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-block .val { font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      border-radius: 3px; background: var(--track); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; box-shadow: 0 0 0 3px rgba(59,130,246,.25);
    }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
    #hud { position: absolute; bottom: 16px; left: 16px; display: flex; gap: 8px; z-index: 10; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: var(--panel-bg); backdrop-filter: blur(12px); color: var(--text);
      cursor: pointer; display: grid; place-items: center; font-size: 18px;
    }
    .icon-btn:hover { background: rgba(40,46,60,.95); }
    .icon-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
    .icon-btn.wide { width: auto; padding: 0 14px; border-radius: 20px; font-size: 14px; font-family: inherit; font-weight: 500; }
    #mode-tip {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20,24,34,.85); border: 1px solid var(--panel-border);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--muted);
      z-index: 10; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap;
    }
    #mode-tip.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <aside id="panel">
    <div class="section">
      <div class="section-title">设置</div>
      <div class="btn-group" id="material-group">
        <button class="btn" data-material="mirror">平面镜</button>
        <button class="btn active" data-material="clear">透明玻璃</button>
        <button class="btn" data-material="tea">茶色玻璃</button>
      </div>
      <div class="row">
        <span class="label">固定镜面</span>
        <label class="switch"><input type="checkbox" id="fix-mirror" /><span class="slider"></span></label>
      </div>
      <div class="row">
        <span class="label">桌面</span>
        <div class="btn-group" style="margin:0;flex:1;">
          <button class="btn active" id="paper-white">白纸</button>
          <button class="btn" id="paper-grid">方格纸</button>
        </div>
      </div>
      <div class="slider-block">
        <div class="top"><span class="label">镜面厚度</span><span class="val" id="thickness-val">1.0 mm</span></div>
        <input type="range" id="thickness" min="0" max="100" value="0" />
        <div class="hint">越厚，玻璃中重影越明显（平面镜无重影）</div>
      </div>
      <div class="slider-block">
        <div class="top"><span class="label">镜面角度</span><span class="val" id="tilt-val">0°</span></div>
        <input type="range" id="tilt" min="-30" max="30" value="0" />
        <div class="hint">前倾 / 后仰；倾斜后像离开桌面，不可点像的位置</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">绘制</div>
      <div class="btn-group" id="mode-group">
        <button class="btn active" data-mode="point">点点模式</button>
        <button class="btn" data-mode="measure">测距模式</button>
      </div>
      <div class="btn-group" id="tool-group">
        <button class="btn full" data-tool="object">物的位置</button>
        <button class="btn full" data-tool="image">像的位置</button>
        <button class="btn full" data-tool="mirrorLine">平面镜位置</button>
        <button class="btn full" data-tool="ruler" disabled>尺子辅助线</button>
        <button class="btn full" data-tool="erase">擦除</button>
      </div>
      <button class="btn ghost-danger full" id="clear-draw">清除绘制</button>
    </div>
    <div class="section">
      <div class="section-title">特殊视角</div>
      <div class="btn-group" id="view-group">
        <button class="btn active" data-view="oblique">斜视</button>
        <button class="btn" data-view="top">俯视</button>
      </div>
    </div>
  </aside>
  <div id="hud">
    <button class="icon-btn" id="reset-cam" title="重置视角">↻</button>
  </div>
  <div id="mode-tip"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const CM = 0.04;
const PAPER_W = 56;
const PAPER_D = 40;
const PAPER_Y = 0.002;
const MIRROR_H = 0.98;
const MIRROR_W = PAPER_D * CM * 0.86;
const THICK_MIN = 0.1 * CM; // 1 mm
const THICK_MAX = 1 * CM;   // 1 cm

const state = {
  material: 'clear',
  fixMirror: false,
  paperGrid: false,
  thickness: 0,
  tiltDeg: 0,
  drawMode: 'point',
  tool: null,
  rulerFirst: null,
  dragging: null,
  markQueue: [],
  pencilBusy: false,
  viewMode: 'oblique',
};

const CIRCLE_R = 1.2 * CM;
const SNAP_R = 1.0 * CM;
let markIdSeq = 1;

const marks = { objects: [], images: [], mirrorLine: null, measures: [], rulers: [] };

const tipEl = document.getElementById('mode-tip');
const wrap = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a4050);
scene.fog = new THREE.Fog(0x3a4050, 12, 28);

// 浅色房间内壁：镜面斜视时反射到实验室灰，而不是虚空黑洞
const room = new THREE.Mesh(
  new THREE.BoxGeometry(14, 8, 14),
  new THREE.MeshBasicMaterial({ color: 0x8a93a3, side: THREE.BackSide })
);
room.position.y = 2.5;
scene.add(room);

const perspCamera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 50);
const OBLIQUE_POS = new THREE.Vector3(-2.55, 1.6, 1.2);
const OBLIQUE_TARGET = new THREE.Vector3(0, 0.3, 0);
perspCamera.position.copy(OBLIQUE_POS);

const TABLE_HALF_W = (PAPER_W * CM + 0.48) / 2;
const TABLE_HALF_D = (PAPER_D * CM + 0.38) / 2;
function makeOrthoFrustum() {
  const aspect = innerWidth / Math.max(1, innerHeight);
  const margin = 0.35;
  const fitH = TABLE_HALF_D + margin;
  const fitW = TABLE_HALF_W + margin;
  const halfH = Math.max(fitH, fitW / aspect);
  const halfW = halfH * aspect;
  return { left: -halfW, right: halfW, top: halfH, bottom: -halfH };
}
const orthoFrust = makeOrthoFrustum();
const orthoCamera = new THREE.OrthographicCamera(
  orthoFrust.left, orthoFrust.right, orthoFrust.top, orthoFrust.bottom, 0.1, 40
);
orthoCamera.position.set(0, 6, 0);
orthoCamera.up.set(0, 0, -1);
orthoCamera.lookAt(0, 0, 0);

let camera = perspCamera;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(OBLIQUE_TARGET);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 1.4;
controls.maxDistance = 8;
controls.minZoom = 0.45;
controls.maxZoom = 3.5;

scene.add(new THREE.AmbientLight(0xb8c0d4, 0.65));
scene.add(new THREE.HemisphereLight(0xdde4ff, 0x3a3028, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(-2.5, 4.5, 2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 14;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);

function makeWoodTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#5c3d28';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 80; i++) {
    g.strokeStyle = `rgba(${40 + Math.random() * 30},${22 + Math.random() * 18},10,${0.15 + Math.random() * 0.25})`;
    g.lineWidth = 1 + Math.random() * 3;
    const y = Math.random() * 512;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x < 512; x += 16) g.lineTo(x, y + Math.sin(x * 0.02 + i) * 4);
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makePaperTexture(grid) {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#f2f2f0';
  g.fillRect(0, 0, 1024, 1024);
  if (grid) {
    const stepX = 1024 / PAPER_W;
    const stepZ = 1024 / PAPER_D;
    g.strokeStyle = '#c5cdd8';
    g.lineWidth = 1;
    for (let i = 0; i <= PAPER_W; i++) {
      const x = i * stepX;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke();
    }
    for (let j = 0; j <= PAPER_D; j++) {
      const y = j * stepZ;
      g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke();
    }
    g.strokeStyle = '#9aa8b8';
    g.lineWidth = 1.5;
    for (let i = 0; i <= PAPER_W; i += 5) {
      const x = i * stepX;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke();
    }
    for (let j = 0; j <= PAPER_D; j += 5) {
      const y = j * stepZ;
      g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

const table = new THREE.Mesh(
  new THREE.BoxGeometry(PAPER_W * CM + 0.48, 0.08, PAPER_D * CM + 0.38),
  new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.75 })
);
table.position.y = -0.04;
table.receiveShadow = true;
table.castShadow = true;
scene.add(table);

const paperMat = new THREE.MeshStandardMaterial({ map: makePaperTexture(false), roughness: 0.92 });
const paper = new THREE.Mesh(new THREE.PlaneGeometry(PAPER_W * CM, PAPER_D * CM), paperMat);
paper.rotation.x = -Math.PI / 2;
paper.position.y = PAPER_Y;
paper.receiveShadow = true;
scene.add(paper);
const paperPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -PAPER_Y);

function setPaperGrid(on) {
  state.paperGrid = on;
  paperMat.map?.dispose();
  paperMat.map = makePaperTexture(on);
  paperMat.needsUpdate = true;
  document.getElementById('paper-white').classList.toggle('active', !on);
  document.getElementById('paper-grid').classList.toggle('active', on);
}

function currentThickness() {
  return THREE.MathUtils.lerp(THICK_MIN, THICK_MAX, state.thickness);
}

/* —— 镜面组 —— */
const mirrorGroup = new THREE.Group();
scene.add(mirrorGroup);

const glassVolume = new THREE.Mesh(
  new THREE.BoxGeometry(1, MIRROR_H, MIRROR_W),
  new THREE.MeshStandardMaterial({
    color: 0xcfe8f5,
    transparent: true,
    opacity: 0.18,
    roughness: 0.08,
    metalness: 0.05,
    depthWrite: false,
    side: THREE.DoubleSide,
  })
);
glassVolume.position.y = MIRROR_H / 2;
mirrorGroup.add(glassVolume);

const opaqueBack = new THREE.Mesh(
  new THREE.PlaneGeometry(MIRROR_W, MIRROR_H),
  new THREE.MeshStandardMaterial({
    color: 0x3d4555,
    roughness: 0.4,
    metalness: 0.55,
    side: THREE.DoubleSide,
  })
);
opaqueBack.rotation.y = -Math.PI / 2;
opaqueBack.position.set(0.003, MIRROR_H / 2, 0);
mirrorGroup.add(opaqueBack);

/** 反射面：Reflector + 浅色清屏，斜视空洞不再变黑 */
function makeReflector(colorHex) {
  const ref = new Reflector(new THREE.PlaneGeometry(MIRROR_W, MIRROR_H), {
    clipBias: 0.02,
    textureWidth: Math.floor(Math.min(1024, innerWidth * devicePixelRatio)),
    textureHeight: Math.floor(Math.min(1024, innerHeight * devicePixelRatio)),
    color: new THREE.Color(colorHex),
  });
  ref.rotation.y = -Math.PI / 2;
  ref.position.y = MIRROR_H / 2;
  ref.material.transparent = true;
  ref.material.depthWrite = false;
  ref.material.uniforms.opacity = { value: 0.45 };
  ref.material.fragmentShader = ref.material.fragmentShader
    .replace('uniform vec3 color;', 'uniform vec3 color;\n\tuniform float opacity;')
    .replace(
      'gl_FragColor = vec4( blendOverlay( base.rgb, color ), 1.0 );',
      'gl_FragColor = vec4( blendOverlay( base.rgb, color ), opacity );'
    );
  ref.userData.setOpacity = (v) => { ref.material.uniforms.opacity.value = v; };

  // 反射通道清成实验室浅灰，避免虚拟相机裁切后出现黑洞
  const prevOnBefore = ref.onBeforeRender;
  ref.onBeforeRender = function (renderer, scene, camera) {
    const prevColor = new THREE.Color();
    const prevAlpha = renderer.getClearAlpha();
    renderer.getClearColor(prevColor);
    renderer.setClearColor(0xb8c4d0, 1);
    // 渲染时隐藏另一张反射面，防止递归
    const other = this === frontReflector ? backReflector : frontReflector;
    const wasOther = other.visible;
    other.visible = false;
    const wasOpaque = opaqueBack.visible;
    const wasSA = supportA.visible;
    const wasSB = supportB.visible;
    // 平面镜正面绘制反射时暂时藏起深色背板与支架，避免透黑/黑块
    if (state.material === 'mirror') opaqueBack.visible = false;
    supportA.visible = false;
    supportB.visible = false;
    prevOnBefore.call(this, renderer, scene, camera);
    other.visible = wasOther;
    opaqueBack.visible = wasOpaque;
    supportA.visible = wasSA;
    supportB.visible = wasSB;
    renderer.setClearColor(prevColor, prevAlpha);
  };
  return ref;
}

const frontReflector = makeReflector(0xaaccdd);
const backReflector = makeReflector(0x99bbcc);
mirrorGroup.add(frontReflector, backReflector);

function makeSupport(zSign) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a3426, roughness: 0.8 });
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.032, 0.075), mat);
  base.position.set(0, 0.016, 0);
  base.castShadow = true;
  const upright = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.085, 0.075), mat);
  upright.position.set(0.024, 0.048, 0);
  upright.castShadow = true;
  g.add(base, upright);
  g.position.set(0, 0, zSign * MIRROR_W * 0.4);
  return g;
}
const supportA = makeSupport(1);
const supportB = makeSupport(-1);
mirrorGroup.add(supportA, supportB);

function createCandle(lit) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.028, 0.032, 0.18, 20),
    new THREE.MeshStandardMaterial({ color: lit ? 0x8b5a2b : 0x7a4e24, roughness: 0.7 })
  );
  body.position.y = 0.09;
  body.castShadow = true;
  g.add(body);

  const wick = new THREE.Mesh(
    new THREE.CylinderGeometry(0.003, 0.003, 0.025, 6),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  wick.position.y = 0.19;
  g.add(wick);

  let flame = null, glow = null, light = null;
  if (lit) {
    const flameGeo = new THREE.SphereGeometry(0.022, 12, 12);
    flameGeo.scale(0.7, 1.5, 0.7);
    flame = new THREE.Mesh(
      flameGeo,
      new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.95 })
    );
    flame.position.y = 0.225;
    g.add(flame);

    glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.25 })
    );
    glow.position.y = 0.22;
    g.add(glow);

    light = new THREE.PointLight(0xff9944, 1.1, 2.5, 2);
    light.position.y = 0.24;
    g.add(light);
  }
  g.userData = { lit, flame, glow, light };
  return g;
}

const litCandle = createCandle(true);
litCandle.position.set(-0.62, 0, 0.06);
scene.add(litCandle);

const unlitCandle = createCandle(false);
unlitCandle.position.set(0.66, 0, -0.08);
scene.add(unlitCandle);

const screenGroup = new THREE.Group();
const screenBoard = new THREE.Mesh(
  new THREE.BoxGeometry(0.012, 0.42, 0.22),
  new THREE.MeshStandardMaterial({ color: 0xf5f5f2, roughness: 0.9 })
);
screenBoard.position.y = 0.21;
screenBoard.castShadow = true;
const screenStand = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.02, 0.1),
  new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7 })
);
screenStand.position.y = 0.01;
screenGroup.add(screenBoard, screenStand);
screenGroup.position.set(0.95, 0, 0.22);
scene.add(screenGroup);

const drawRoot = new THREE.Group();
drawRoot.position.y = PAPER_Y + 0.0015;
scene.add(drawRoot);

function applyMaterialVisual() {
  const t = state.thickness;
  const ghost = Math.pow(t, 0.85);

  if (state.material === 'mirror') {
    glassVolume.visible = false;
    opaqueBack.visible = true;
    frontReflector.visible = true;
    backReflector.visible = false;
    frontReflector.userData.setOpacity(1);
    frontReflector.material.uniforms.color.value.set(0x99aabb);
  } else if (state.material === 'clear') {
    glassVolume.visible = true;
    opaqueBack.visible = false;
    frontReflector.visible = true;
    backReflector.visible = ghost > 0.04;
    glassVolume.material.color.set(0xc5e4f0);
    glassVolume.material.opacity = 0.2 + t * 0.1;
    frontReflector.userData.setOpacity(0.28 + ghost * 0.18);
    backReflector.userData.setOpacity(0.34 + ghost * 0.32);
    frontReflector.material.uniforms.color.value.set(0xa8d4e4);
    backReflector.material.uniforms.color.value.set(0x96c4d6);
  } else {
    glassVolume.visible = true;
    opaqueBack.visible = false;
    frontReflector.visible = true;
    backReflector.visible = ghost > 0.04;
    glassVolume.material.color.set(0x8b6914);
    glassVolume.material.opacity = 0.28 + t * 0.18;
    frontReflector.userData.setOpacity(0.32 + ghost * 0.25);
    backReflector.userData.setOpacity(0.45 + ghost * 0.4);
    frontReflector.material.uniforms.color.value.set(0xc4a050);
    backReflector.material.uniforms.color.value.set(0xb89040);
  }
}

function updateMirrorGeometry() {
  const thick = currentThickness();
  glassVolume.scale.set(thick, 1, 1);
  const half = thick / 2;
  frontReflector.position.x = -half;
  backReflector.position.x = half;
  opaqueBack.position.x = half + 0.0015;
  applyMaterialVisual();
}

function updateMirrorTransform() {
  mirrorGroup.rotation.z = THREE.MathUtils.degToRad(state.tiltDeg);
  updateMirrorGeometry();
  clampAllObjects();
  refreshMeasureLines();
  updateImageToolEnabled();
}

function getMirrorCenterX() {
  return mirrorGroup.position.x;
}

function isTilted() {
  return Math.abs(state.tiltDeg) > 0.5;
}

function paperBounds() {
  const hw = (PAPER_W * CM) / 2 - 0.04;
  const hd = (PAPER_D * CM) / 2 - 0.04;
  return { hw, hd };
}

function clampToPaper(pos) {
  const { hw, hd } = paperBounds();
  pos.x = THREE.MathUtils.clamp(pos.x, -hw, hw);
  pos.z = THREE.MathUtils.clamp(pos.z, -hd, hd);
  return pos;
}

function clampLitCandle() {
  const mx = getMirrorCenterX();
  const half = currentThickness() / 2 + 0.05;
  const { hw, hd } = paperBounds();
  litCandle.position.x = THREE.MathUtils.clamp(litCandle.position.x, -hw, mx - half);
  litCandle.position.z = THREE.MathUtils.clamp(litCandle.position.z, -hd, hd);
  litCandle.position.y = 0;
}

function clampUnlitCandle() {
  const mx = getMirrorCenterX();
  const half = currentThickness() / 2 + 0.05;
  const { hw, hd } = paperBounds();
  unlitCandle.position.x = THREE.MathUtils.clamp(unlitCandle.position.x, mx + half, hw);
  unlitCandle.position.z = THREE.MathUtils.clamp(unlitCandle.position.z, -hd, hd);
  unlitCandle.position.y = 0;
}

function clampScreen() {
  const mx = getMirrorCenterX();
  const half = currentThickness() / 2 + 0.06;
  const { hw, hd } = paperBounds();
  screenGroup.position.x = THREE.MathUtils.clamp(screenGroup.position.x, mx + half, hw);
  screenGroup.position.z = THREE.MathUtils.clamp(screenGroup.position.z, -hd, hd);
  screenGroup.position.y = 0;
}

function clampMirror() {
  const { hw, hd } = paperBounds();
  mirrorGroup.position.x = THREE.MathUtils.clamp(mirrorGroup.position.x, -hw * 0.5, hw * 0.5);
  mirrorGroup.position.z = THREE.MathUtils.clamp(mirrorGroup.position.z, -hd * 0.25, hd * 0.25);
  mirrorGroup.position.y = 0;
}

function clampAllObjects() {
  clampMirror();
  clampLitCandle();
  clampUnlitCandle();
  clampScreen();
}

/* —— 绘制 —— */
function makeCrosshair(color) {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color });
  const s = 0.035;
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-s, 0, 0), new THREE.Vector3(s, 0, 0),
  ]), mat));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, -s), new THREE.Vector3(0, 0, s),
  ]), mat));
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.012, 0.016, 24),
    new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  g.add(ring);
  return g;
}

function makeInkCircle(x, z) {
  const pts = [];
  const segs = 48;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    pts.push(new THREE.Vector3(x + Math.cos(a) * CIRCLE_R, 0.001, z + Math.sin(a) * CIRCLE_R));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x111827 })
  );
}

function makeLabelSprite(text, color = '#3b82f6') {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = '600 28px "Noto Sans SC", sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(0.28, 0.07, 1);
  return spr;
}

function createPencil() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.004, 0.005, 0.11, 8),
    new THREE.MeshStandardMaterial({ color: 0xc4a35a, roughness: 0.7 })
  );
  body.position.y = 0.07;
  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(0.005, 0.022, 8),
    new THREE.MeshStandardMaterial({ color: 0x5c4030, roughness: 0.6 })
  );
  tip.position.y = 0.009;
  tip.rotation.x = Math.PI;
  const lead = new THREE.Mesh(
    new THREE.ConeGeometry(0.0018, 0.01, 6),
    new THREE.MeshBasicMaterial({ color: 0x1a1a1a })
  );
  lead.position.y = -0.002;
  lead.rotation.x = Math.PI;
  g.add(body, tip, lead);
  g.rotation.z = -0.55;
  g.visible = false;
  scene.add(g);
  return g;
}

const drawPencil = createPencil();
let pencilAnim = null; // { cx, cz, start, trail, kind, color, labelPrefix }

function disposeObject3D(obj) {
  if (!obj) return;
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

function finalizeCircleMark(cx, cz, kind) {
  const isObj = kind === 'object';
  const color = isObj ? 0x2563eb : 0xdc2626;
  const css = isObj ? '#2563eb' : '#dc2626';
  const list = isObj ? marks.objects : marks.images;
  const prefix = isObj ? '物' : '像';

  const circle = makeInkCircle(cx, cz);
  drawRoot.add(circle);
  const mesh = makeCrosshair(color);
  mesh.position.set(cx, 0, cz);
  drawRoot.add(mesh);
  const n = list.length + 1;
  const label = makeLabelSprite(`${prefix}${n}`, css);
  label.position.set(cx, 0.02, cz + CIRCLE_R + 0.02);
  drawRoot.add(label);

  const entry = {
    id: markIdSeq++,
    kind,
    mesh,
    label,
    circle,
    x: cx,
    z: cz,
  };
  list.push(entry);
  refreshMeasureLines();
  return entry;
}

function startPencilMark(kind) {
  const candle = kind === 'object' ? litCandle : unlitCandle;
  if (kind === 'image' && isTilted()) {
    showTip('镜面已倾斜，像离开桌面，不能点像的位置');
    return;
  }
  const cx = candle.position.x;
  const cz = candle.position.z;
  state.markQueue.push({ kind, cx, cz });
  pumpMarkQueue();
}

function pumpMarkQueue() {
  if (state.pencilBusy || !state.markQueue.length) return;
  const job = state.markQueue.shift();
  state.pencilBusy = true;

  const trailPts = [];
  const trailGeo = new THREE.BufferGeometry();
  const trail = new THREE.Line(
    trailGeo,
    new THREE.LineBasicMaterial({ color: 0x111827 })
  );
  drawRoot.add(trail);

  const start = performance.now();
  const duration = 600;
  pencilAnim = { job, trail, trailPts, trailGeo, start, duration };

  drawPencil.visible = true;
  showTip(job.kind === 'object' ? '正在标记物的位置…' : '正在标记像的位置…', 800);
}

function updatePencilAnim(now) {
  if (!pencilAnim) return;
  const { job, trail, trailPts, trailGeo, start, duration } = pencilAnim;
  const t = Math.min(1, (now - start) / duration);
  const angle = t * Math.PI * 2;
  const px = job.cx + Math.cos(angle) * CIRCLE_R;
  const pz = job.cz + Math.sin(angle) * CIRCLE_R;

  drawPencil.position.set(px, 0.02, pz);
  drawPencil.rotation.y = -angle + Math.PI / 2;

  trailPts.push(new THREE.Vector3(px, 0.0015, pz));
  trailGeo.setFromPoints(trailPts);
  trailGeo.attributes.position.needsUpdate = true;

  if (t >= 1) {
    drawRoot.remove(trail);
    disposeObject3D(trail);
    drawPencil.visible = false;
    pencilAnim = null;
    finalizeCircleMark(job.cx, job.cz, job.kind);
    state.pencilBusy = false;
    showTip(job.kind === 'object' ? '已标记物的位置' : '已标记像的位置');
    pumpMarkQueue();
  }
}

function cancelPencilAnim() {
  state.markQueue = [];
  if (pencilAnim) {
    drawRoot.remove(pencilAnim.trail);
    disposeObject3D(pencilAnim.trail);
    pencilAnim = null;
  }
  drawPencil.visible = false;
  state.pencilBusy = false;
}

function setMirrorLine() {
  if (marks.mirrorLine) {
    drawRoot.remove(marks.mirrorLine);
    disposeObject3D(marks.mirrorLine);
    marks.mirrorLine = null;
  }
  const mx = getMirrorCenterX();
  const halfZ = (PAPER_D * CM) / 2 - 0.02;
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(mx, 0, -halfZ), new THREE.Vector3(mx, 0, halfZ),
    ]),
    new THREE.LineBasicMaterial({ color: 0x111827 })
  );
  const label = makeLabelSprite('镜', '#111827');
  label.position.set(mx + 0.05, 0.02, halfZ - 0.05);
  const g = new THREE.Group();
  g.add(line, label);
  g.userData.kind = 'mirrorLine';
  drawRoot.add(g);
  marks.mirrorLine = g;
  refreshMeasureLines();
}

function clearMeasureVisuals() {
  marks.measures.forEach(m => {
    drawRoot.remove(m.group);
    disposeObject3D(m.group);
  });
  marks.measures = [];
}

function removeMarkEntry(entry) {
  drawRoot.remove(entry.mesh);
  drawRoot.remove(entry.label);
  if (entry.circle) drawRoot.remove(entry.circle);
  disposeObject3D(entry.mesh);
  disposeObject3D(entry.label);
  disposeObject3D(entry.circle);
}

function clearDrawings() {
  cancelPencilAnim();
  [...marks.objects, ...marks.images].forEach(removeMarkEntry);
  marks.objects = [];
  marks.images = [];
  if (marks.mirrorLine) {
    drawRoot.remove(marks.mirrorLine);
    disposeObject3D(marks.mirrorLine);
    marks.mirrorLine = null;
  }
  clearMeasureVisuals();
  marks.rulers.forEach(r => {
    drawRoot.remove(r.group);
    disposeObject3D(r.group);
  });
  marks.rulers = [];
  state.rulerFirst = null;
}

function distCm(a, b) {
  return Math.hypot(a.x - b.x, a.z - b.z) / CM;
}

function allMarkCenters() {
  return [...marks.objects, ...marks.images];
}

function nearestMarkCenter(x, z, maxDist = SNAP_R) {
  let best = null;
  let bestD = maxDist;
  allMarkCenters().forEach(m => {
    const d = Math.hypot(m.x - x, m.z - z);
    if (d < bestD) {
      bestD = d;
      best = m;
    }
  });
  return best;
}

function refreshMeasureLines() {
  clearMeasureVisuals();
  if (state.drawMode !== 'measure' || !marks.mirrorLine) return;
  const mx = getMirrorCenterX();
  const corner = 0.7 * CM;

  const addPerp = (mark, colorHex, cssColor) => {
    const group = new THREE.Group();
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(mark.x, 0.001, mark.z),
      new THREE.Vector3(mx, 0.001, mark.z),
    ]);
    const line = new THREE.Line(geo, new THREE.LineDashedMaterial({
      color: colorHex, dashSize: 0.02, gapSize: 0.012,
    }));
    line.computeLineDistances();
    group.add(line);

    // 垂足直角符号：开口朝向标记一侧
    const sx = mark.x < mx ? -1 : 1;
    const cornerPts = [
      new THREE.Vector3(mx + sx * corner, 0.0015, mark.z),
      new THREE.Vector3(mx + sx * corner, 0.0015, mark.z + corner),
      new THREE.Vector3(mx, 0.0015, mark.z + corner),
    ];
    group.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(cornerPts),
      new THREE.LineBasicMaterial({ color: colorHex })
    ));

    const d = Math.abs(mark.x - mx) / CM;
    const spr = makeLabelSprite(`${d.toFixed(1)} cm`, cssColor);
    spr.position.set((mark.x + mx) / 2, 0.03, mark.z + 0.03);
    group.add(spr);
    drawRoot.add(group);
    marks.measures.push({ group });
  };

  marks.objects.forEach(m => addPerp(m, 0x2563eb, '#2563eb'));
  marks.images.forEach(m => addPerp(m, 0xdc2626, '#dc2626'));
}

function addRuler(a, b) {
  const group = new THREE.Group();
  group.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.x, 0.002, a.z),
      new THREE.Vector3(b.x, 0.002, b.z),
    ]),
    new THREE.LineBasicMaterial({ color: 0x16a34a })
  ));
  const spr = makeLabelSprite(`${distCm(a, b).toFixed(1)} cm`, '#16a34a');
  spr.position.set((a.x + b.x) / 2, 0.035, (a.z + b.z) / 2);
  group.add(spr);
  [a, b].forEach(p => {
    const dot = new THREE.Mesh(
      new THREE.CircleGeometry(0.01, 12),
      new THREE.MeshBasicMaterial({ color: 0x16a34a, side: THREE.DoubleSide })
    );
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(p.x, 0.002, p.z);
    group.add(dot);
  });
  drawRoot.add(group);
  marks.rulers.push({
    id: markIdSeq++,
    group,
    a: { x: a.x, z: a.z },
    b: { x: b.x, z: b.z },
  });
}

/** 擦除：点中某条绘制则只删这一条 */
function eraseAt(x, z) {
  const hitMark = nearestMarkCenter(x, z, CIRCLE_R * 1.4);
  if (hitMark) {
    const list = hitMark.kind === 'object' ? marks.objects : marks.images;
    const idx = list.indexOf(hitMark);
    if (idx >= 0) list.splice(idx, 1);
    removeMarkEntry(hitMark);
    refreshMeasureLines();
    showTip('已擦除该标记');
    return true;
  }

  if (marks.mirrorLine) {
    const mx = getMirrorCenterX();
    if (Math.abs(x - mx) < 0.04) {
      drawRoot.remove(marks.mirrorLine);
      disposeObject3D(marks.mirrorLine);
      marks.mirrorLine = null;
      refreshMeasureLines();
      showTip('已擦除平面镜位置线');
      return true;
    }
  }

  for (let i = marks.rulers.length - 1; i >= 0; i--) {
    const r = marks.rulers[i];
    const dist = distPointToSegment(x, z, r.a.x, r.a.z, r.b.x, r.b.z);
    if (dist < 0.035) {
      drawRoot.remove(r.group);
      disposeObject3D(r.group);
      marks.rulers.splice(i, 1);
      showTip('已擦除该尺子');
      return true;
    }
  }

  showTip('请点中要擦除的圈、镜迹或尺子');
  return false;
}

function distPointToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax;
  const dz = bz - az;
  const len2 = dx * dx + dz * dz;
  if (len2 < 1e-10) return Math.hypot(px - ax, pz - az);
  let t = ((px - ax) * dx + (pz - az) * dz) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
}

/* —— 交互 —— */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hitPoint = new THREE.Vector3();

function setPointer(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}

function rayToPaper(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.ray.intersectPlane(paperPlane, hitPoint) ? hitPoint.clone() : null;
}

function pickDraggable(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const roots = [litCandle, unlitCandle, screenGroup];
  if (!state.fixMirror) roots.push(mirrorGroup);
  const meshes = [];
  roots.forEach(r => r.traverse(o => { if (o.isMesh) meshes.push(o); }));
  const hits = raycaster.intersectObjects(meshes, false);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj) {
    if (obj === litCandle) return 'lit';
    if (obj === unlitCandle) return 'unlit';
    if (obj === screenGroup) return 'screen';
    if (obj === mirrorGroup) return 'mirror';
    obj = obj.parent;
  }
  return null;
}

function showTip(text, ms = 2200) {
  tipEl.textContent = text;
  tipEl.classList.add('show');
  clearTimeout(showTip._t);
  showTip._t = setTimeout(() => tipEl.classList.remove('show'), ms);
}

function updateImageToolEnabled() {
  const imgBtn = document.querySelector('[data-tool="image"]');
  imgBtn.disabled = isTilted();
  if (isTilted() && state.tool === 'image') {
    state.tool = null;
  }
  syncToolButtons();
}

function syncToolButtons() {
  document.querySelectorAll('#tool-group .btn').forEach(btn => {
    const tool = btn.dataset.tool;
    btn.disabled = (tool === 'ruler' && state.drawMode !== 'measure') || (tool === 'image' && isTilted());
    btn.classList.toggle('active', state.tool === tool && !btn.disabled);
  });
}

function updateModeUI() {
  document.querySelectorAll('#mode-group .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.drawMode);
  });
  if (state.drawMode === 'point' && state.tool === 'ruler') {
    state.tool = null;
    state.rulerFirst = null;
  }
  if (state.drawMode === 'measure' && (state.tool === 'object' || state.tool === 'image' || state.tool === 'mirrorLine')) {
    // 测距模式下仍可用擦除；点点工具切模式时清掉
  }
  syncToolButtons();
  refreshMeasureLines();
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;

  if (state.tool) {
    const p = rayToPaper(e);
    if (!p) return;
    clampToPaper(p);

    if (state.tool === 'erase') {
      eraseAt(p.x, p.z);
      return;
    }
    if (state.tool === 'object') {
      startPencilMark('object');
      return;
    }
    if (state.tool === 'image') {
      startPencilMark('image');
      return;
    }
    if (state.tool === 'mirrorLine') {
      setMirrorLine();
      showTip('已画出平面镜（厚度中心）位置');
      return;
    }
    if (state.tool === 'ruler') {
      const snap = nearestMarkCenter(p.x, p.z);
      if (!snap) {
        showTip('请点中已有准星的中心');
        return;
      }
      if (!state.rulerFirst) {
        state.rulerFirst = { x: snap.x, z: snap.z };
        showTip('再点另一个准星中心完成测距');
      } else {
        if (Math.hypot(snap.x - state.rulerFirst.x, snap.z - state.rulerFirst.z) < 0.001) {
          showTip('请选择另一个准星');
          return;
        }
        addRuler(state.rulerFirst, { x: snap.x, z: snap.z });
        state.rulerFirst = null;
        showTip('已量出两准星中心距离');
      }
      return;
    }
  }

  const kind = pickDraggable(e);
  if (!kind) return;
  const p = rayToPaper(e);
  if (!p) return;
  const target = kind === 'lit' ? litCandle
    : kind === 'unlit' ? unlitCandle
    : kind === 'screen' ? screenGroup
    : mirrorGroup;
  state.dragging = { type: kind, offset: new THREE.Vector3().subVectors(target.position, p) };
  controls.enabled = false;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!state.dragging) return;
  const p = rayToPaper(e);
  if (!p) return;
  const pos = p.add(state.dragging.offset);
  clampToPaper(pos);
  if (state.dragging.type === 'lit') {
    litCandle.position.set(pos.x, 0, pos.z);
    clampLitCandle();
  } else if (state.dragging.type === 'unlit') {
    unlitCandle.position.set(pos.x, 0, pos.z);
    clampUnlitCandle();
  } else if (state.dragging.type === 'screen') {
    screenGroup.position.set(pos.x, 0, pos.z);
    clampScreen();
  } else if (state.dragging.type === 'mirror' && !state.fixMirror) {
    mirrorGroup.position.x = pos.x;
    mirrorGroup.position.z = THREE.MathUtils.clamp(pos.z, -0.15, 0.15);
    clampAllObjects();
    if (marks.mirrorLine) setMirrorLine();
  }
});

function endDrag() {
  state.dragging = null;
  controls.enabled = true;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointerleave', endDrag);

/* UI */
document.querySelectorAll('#material-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.material = btn.dataset.material;
    document.querySelectorAll('#material-group .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyMaterialVisual();
  });
});
document.getElementById('fix-mirror').addEventListener('change', e => {
  state.fixMirror = e.target.checked;
});
document.getElementById('paper-white').addEventListener('click', () => setPaperGrid(false));
document.getElementById('paper-grid').addEventListener('click', () => setPaperGrid(true));

const thicknessInput = document.getElementById('thickness');
const thicknessVal = document.getElementById('thickness-val');
thicknessInput.addEventListener('input', () => {
  state.thickness = Number(thicknessInput.value) / 100;
  const mm = (currentThickness() / CM) * 10;
  thicknessVal.textContent = mm >= 9.95 ? '1.0 cm' : `${mm.toFixed(1)} mm`;
  updateMirrorTransform();
  if (marks.mirrorLine) setMirrorLine();
});

const tiltInput = document.getElementById('tilt');
const tiltVal = document.getElementById('tilt-val');
tiltInput.addEventListener('input', () => {
  state.tiltDeg = Number(tiltInput.value);
  tiltVal.textContent = `${state.tiltDeg}°`;
  updateMirrorTransform();
});

document.querySelectorAll('#mode-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.drawMode = btn.dataset.mode;
    state.tool = null;
    state.rulerFirst = null;
    updateModeUI();
  });
});

document.querySelectorAll('#tool-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    const tool = btn.dataset.tool;
    state.tool = state.tool === tool ? null : tool;
    state.rulerFirst = null;
    syncToolButtons();
    const tips = {
      object: '点击白纸：铅笔将绕燃烛底部画圈并出十字准星',
      image: '点击白纸：铅笔将绕未燃烛底部画圈并出十字准星',
      mirrorLine: '点击后在镜面厚度中心画线',
      ruler: '依次点中两个准星中心，量出距离',
      erase: '点中某一圈、镜迹或尺子即可单独擦除',
    };
    if (state.tool) showTip(tips[state.tool]);
  });
});

document.getElementById('clear-draw').addEventListener('click', () => {
  clearDrawings();
  showTip('已清除全部绘制');
});

function applyTopViewCamera() {
  const f = makeOrthoFrustum();
  orthoCamera.left = f.left;
  orthoCamera.right = f.right;
  orthoCamera.top = f.top;
  orthoCamera.bottom = f.bottom;
  orthoCamera.zoom = 1;
  orthoCamera.position.set(0, 6, 0);
  orthoCamera.up.set(0, 0, -1);
  orthoCamera.lookAt(0, 0, 0);
  orthoCamera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

function applyObliqueCamera() {
  camera = perspCamera;
  controls.object = perspCamera;
  controls.enableRotate = true;
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 1.4;
  controls.maxDistance = 8;
  perspCamera.position.copy(OBLIQUE_POS);
  perspCamera.up.set(0, 1, 0);
  controls.target.copy(OBLIQUE_TARGET);
  controls.update();
}

function syncViewButtons() {
  document.querySelectorAll('#view-group .btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === state.viewMode);
  });
}

function setViewMode(mode) {
  state.viewMode = mode;
  syncViewButtons();

  if (mode === 'top') {
    camera = orthoCamera;
    controls.object = orthoCamera;
    controls.enableRotate = false;
    controls.enablePan = true;
    controls.enableZoom = true;
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI;
    applyTopViewCamera();
    showTip('俯视模式：可平移/缩放', 2000);
  } else {
    applyObliqueCamera();
    showTip('斜视模式：可旋转/缩放观察玻璃正面', 2000);
  }
}

document.querySelectorAll('#view-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.view;
    if (mode === state.viewMode) {
      if (mode === 'top') applyTopViewCamera();
      else applyObliqueCamera();
      return;
    }
    setViewMode(mode);
  });
});

document.getElementById('reset-cam').addEventListener('click', () => {
  if (state.viewMode === 'top') applyTopViewCamera();
  else applyObliqueCamera();
});

addEventListener('resize', () => {
  const aspect = innerWidth / Math.max(1, innerHeight);
  perspCamera.aspect = aspect;
  perspCamera.updateProjectionMatrix();
  if (state.viewMode === 'top') {
    const f = makeOrthoFrustum();
    const z = orthoCamera.zoom;
    orthoCamera.left = f.left;
    orthoCamera.right = f.right;
    orthoCamera.top = f.top;
    orthoCamera.bottom = f.bottom;
    orthoCamera.zoom = z;
    orthoCamera.updateProjectionMatrix();
  }
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animateFlame(t) {
  const flame = litCandle.userData.flame;
  const glow = litCandle.userData.glow;
  const light = litCandle.userData.light;
  if (!flame) return;
  const flicker = 0.85 + Math.sin(t * 17.3) * 0.08 + Math.sin(t * 31.7) * 0.05;
  flame.scale.set(0.7 * flicker, 1.35 + Math.sin(t * 22) * 0.15, 0.7 * flicker);
  flame.position.x = Math.sin(t * 14) * 0.004;
  flame.position.z = Math.cos(t * 11) * 0.003;
  if (glow) {
    glow.scale.setScalar(0.9 + Math.sin(t * 19) * 0.15);
    glow.material.opacity = 0.18 + Math.sin(t * 25) * 0.05;
  }
  if (light) light.intensity = 0.95 + Math.sin(t * 20) * 0.2;
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  animateFlame(t);
  updatePencilAnim(performance.now());
  controls.update();
  renderer.render(scene, camera);
}

state.thickness = Number(thicknessInput.value) / 100;
updateMirrorTransform();
updateModeUI();
showTip('拖动蜡烛、光屏与镜面；左侧可切换材质并绘制标记', 3200);
animate();
  </script>
</body>
</html>
